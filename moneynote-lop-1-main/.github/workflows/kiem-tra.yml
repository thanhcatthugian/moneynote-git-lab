name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem-tra:
    name: kiem-tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy kiem-tra-nhom.js
        run: node kiem-tra-nhom.js
